    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Планировыч AI",
        "alternateName": "Планировыч",
        "url": "https://planirovych.ru/"
      }
    </script>
    <script>
      // First-time visitors see the lightweight welcome page before React loads.
      // Established browsers and direct application links keep their existing behavior.
      (function () {
        if (location.pathname !== '/' || location.hash) return;

        // Do not intercept authentication callbacks or unknown deep-link parameters.
        const params = new URLSearchParams(location.search);
        if (params.has('enter')) return;
        for (const key of params.keys()) {
          if (!/^utm_[a-z0-9_]+$/i.test(key) && !/^(yclid|gclid|fbclid)$/i.test(key)) return;
        }

        if (document.cookie.split(';').some(function (cookie) {
          return cookie.trim() === 'planirovych_welcome_seen=1';
        })) return;
        try {
          const storage = localStorage;
          if (storage.getItem('planirovych_welcome_seen_v1') === '1') return;
          if (storage.getItem('planirovych_cookie_consent') !== null) return;
          for (let index = 0; index < storage.length; index += 1) {
            const key = storage.key(index);
            if (key && key.indexOf('btm:') === 0) return;
          }
        } catch {
          // If storage is blocked, prefer the working app to a redirect loop.
          return;
        }

        location.replace('/welcome/' + location.search);
      })();
    </script>
    <script>
      // Show before the JS bundle downloads, only for the desktop planner.
      if (location.pathname === '/' && matchMedia('(min-width: 1025px)').matches) {
        document.documentElement.classList.add('web-workspace-preload');
      }
    </script>
    <style>
      /* Inline, render-blocking CSS is intentional: paint the splash before any app bundles. */
      html.web-workspace-preload, html.web-workspace-preload body { background: #070c1b; }
      #workspace-boot-splash { display: none; }
      .web-workspace-preload #workspace-boot-splash {
        display: flex; position: fixed; inset: 0; z-index: 2147483000;
        align-items: center; justify-content: center; overflow: hidden;
        background: radial-gradient(ellipse at 48% 45%, #172552 0%, #0d1530 44%, #070c1b 100%);
        color: #edf5ff; font-family: Inter, system-ui, sans-serif;
        isolation: isolate;
      }
      #workspace-boot-splash .boot-core { position: relative; text-align: center; padding: 2.5rem 1.5rem; }
      #workspace-boot-splash .boot-halo {
        position: absolute; top: 46%; left: 50%;
        width: min(62vw, 500px); aspect-ratio: 1; border-radius: 50%;
        transform: translate(-50%, -50%); pointer-events: none;
        background: radial-gradient(circle, rgba(109,84,238,.18) 0%, rgba(34,211,238,.08) 28%, transparent 68%);
        filter: blur(3px);
        animation: boot-breathe 3s ease-in-out infinite alternate;
      }
      #workspace-boot-splash .boot-wordmark {
        position: relative; margin: 0;
        font-size: clamp(3.3rem, 7.5vw, 6.4rem); line-height: 1.05;
        font-weight: 820; letter-spacing: -.06em;
        background: linear-gradient(108deg, #fff 14%, #a5b4fc 45%, #67e8f9 70%, #fff 95%);
        background-size: 250% 100%; color: transparent;
        -webkit-background-clip: text; background-clip: text;
        animation: boot-shine 3.5s linear infinite;
      }
      #workspace-boot-splash .boot-subtitle {
        position: relative; margin: .9rem 0 0; font-size: .78rem;
        color: #aab8d7; letter-spacing: .23em; text-transform: uppercase;
      }
      #workspace-boot-splash .boot-loader {
        position: relative; display: flex; width: 180px; height: 4px;
        margin: 2.3rem auto 0; overflow: hidden; border-radius: 99px;
        background: rgba(165,180,252,.15);
      }
      #workspace-boot-splash .boot-loader::after {
        content: ''; width: 48%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #818cf8, #67e8f9);
        box-shadow: 0 0 18px rgba(103,232,249,.4);
        animation: boot-progress 1.7s ease-in-out infinite alternate;
      }
      #workspace-boot-splash .boot-caption {
        position: relative; margin: 1rem 0 0; font-size: .8rem; color: #8494bc;
      }
      @keyframes boot-shine { from { background-position: 120% 0; } to { background-position: -120% 0; } }
      @keyframes boot-breathe { from { opacity: .65; scale: .92; } to { opacity: 1; scale: 1.08; } }
      @keyframes boot-progress { from { transform: translateX(-100%); } to { transform: translateX(310%); } }
      @media (prefers-reduced-motion: reduce) {
        #workspace-boot-splash .boot-halo,
        #workspace-boot-splash .boot-wordmark,
        #workspace-boot-splash .boot-loader::after { animation: none; }
        #workspace-boot-splash .boot-loader::after { transform: translateX(60%); }
      }
    </style>
    <!-- Keep Telegram's bridge available to Mini App, but never let network
         latency on telegram.org block the HTML parser and first splash paint. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body class="bg-slate-950">
    <div id="workspace-boot-splash" role="status" aria-label="Загрузка Планировыча">
      <div class="boot-halo" aria-hidden="true"></div>
      <div class="boot-core">
        <h1 class="boot-wordmark">Планировыч</h1>
        <p class="boot-subtitle">Твой день под контролем</p>
        <div class="boot-loader" aria-hidden="true"></div>
        <p class="boot-caption">Подготавливаем рабочее пространство</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
