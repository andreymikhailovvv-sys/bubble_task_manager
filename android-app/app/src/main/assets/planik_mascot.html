<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<style>html,body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; }
.planik-mascot--composer { display:block; width:100vw !important; height:100vh !important; }
/* Website-only Planik. Keep animations on transforms and opacity for cheap
   rendering, especially next to the bubble workspace. */
.planik-mascot {
  position: relative;
  display: inline-block;
  flex: none;
  vertical-align: middle;
  isolation: isolate;
  overflow: visible;
}
.planik-mascot--launcher { width: 120px; height: 108px; }
.planik-mascot--composer { width: 122px; height: 108px; }
.planik-mascot--sidekick { width: 135px; height: 120px; }
/* Shadow is a sibling of the floating SVG, so it never bobs with Planik. */
.planik-ground-shadow {
  position: absolute;
  left: 52%;
  bottom: 2%;
  width: 36%;
  height: 7%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(5, 12, 35, .28), transparent 78%);
  pointer-events: none;
}
.planik-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 8px 12px rgba(22, 16, 65, .26));
  animation: planik-float 3.6s ease-in-out infinite;
}
.planik-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: planik-blink 5.4s infinite;
}
.planik-notif-static, .planik-notif-take-arm, .planik-notif-flying, .planik-notif-whoosh,
.planik-typing, .planik-thinking,
.planik-searching, .planik-celebrating, .planik-hover {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.planik-mascot[data-mode="idle"][data-has-notifs="true"] .planik-notif-static,
.planik-mascot[data-mode="typing"] .planik-typing,
.planik-mascot[data-mode="thinking"] .planik-thinking,
.planik-mascot[data-mode="searching"] .planik-searching,
.planik-mascot[data-mode="celebrating"] .planik-celebrating,
.planik-mascot[data-mode="hover"] .planik-hover {
  opacity: 1;
  visibility: visible;
}
/* A service-style rose counter replaces the old handheld smartphone.
   Only idle shows a live count. On a real >0 -> 0 transition, the previous
   number remains visible long enough for Planik to pluck it off and toss it. */
.planik-notif-take-arm {
  transform-origin: 133px 190px;
  transform-box: view-box;
}
.planik-notif-held { opacity: 0; }
.planik-notif-flying {
  transform-origin: 130px 94px;
  transform-box: view-box;
}
.planik-mascot[data-mode="clearing"] .planik-notif-static,
.planik-mascot[data-mode="clearing"] .planik-notif-take-arm,
.planik-mascot[data-mode="clearing"] .planik-notif-flying,
.planik-mascot[data-mode="clearing"] .planik-notif-whoosh {
  visibility: visible;
}
.planik-mascot[data-mode="clearing"] .planik-notif-static {
  animation: planik-notif-peel 1.66s steps(1, end) both;
}
.planik-mascot[data-mode="clearing"] .planik-notif-take-arm {
  animation: planik-notif-reach 1.66s ease-in-out both;
}
.planik-mascot[data-mode="clearing"] .planik-notif-held {
  animation: planik-notif-held 1.66s steps(1, end) both;
}
.planik-mascot[data-mode="clearing"] .planik-notif-flying {
  animation: planik-notif-toss 1.66s cubic-bezier(.17,.50,.36,1) both;
}
.planik-mascot[data-mode="clearing"] .planik-notif-whoosh {
  animation: planik-notif-whoosh 1.66s ease-out both;
}
.planik-mascot[data-mode="hover"] .planik-eye { animation: planik-shy-eye 1.35s ease-in-out infinite; }
.planik-mascot[data-mode="hover"] .planik-hover-left {
  transform-origin: 129px 194px;
  transform-box: view-box;
  animation: planik-reach-left .9s ease-in-out infinite alternate;
}
.planik-mascot[data-mode="hover"] .planik-hover-right {
  transform-origin: 303px 194px;
  transform-box: view-box;
  animation: planik-reach-right .85s ease-in-out infinite alternate;
}
.planik-mascot[data-mode="thinking"] .planik-scratch-arm {
  transform-origin: 302px 186px;
  transform-box: view-box;
  animation: planik-scratch .6s ease-in-out infinite alternate;
}
.planik-mascot[data-mode="thinking"] .planik-antenna { animation: planik-glow .75s ease-in-out infinite alternate; }
.planik-mascot[data-mode="typing"] .planik-type-left {
  transform-origin: 134px 211px;
  transform-box: view-box;
  animation: planik-tap-left .27s ease-in-out infinite alternate;
}
.planik-mascot[data-mode="typing"] .planik-type-right {
  transform-origin: 297px 211px;
  transform-box: view-box;
  animation: planik-tap-right .31s ease-in-out .12s infinite alternate;
}
.planik-mascot[data-mode="typing"] .planik-key-a { animation: planik-key .55s steps(1) infinite; }
.planik-mascot[data-mode="typing"] .planik-key-b { animation: planik-key .55s steps(1) .19s infinite; }
.planik-mascot[data-mode="searching"] .planik-loupe {
  transform-origin: 240px 245px;
  transform-box: view-box;
  animation: planik-scan 1.4s ease-in-out infinite alternate;
}
.planik-mascot[data-mode="searching"] .planik-page-one { animation: planik-page-one 3.9s linear infinite; }
.planik-mascot[data-mode="searching"] .planik-page-two { animation: planik-page-two 3.9s linear infinite; }
.planik-mascot[data-mode="searching"] .planik-page-three { animation: planik-page-three 3.9s linear infinite; }
.planik-mascot[data-mode="celebrating"] .planik-celebrate-rig {
  transform-origin: 300px 206px;
  transform-box: view-box;
  animation: planik-popper-lift .48s cubic-bezier(.2,1.1,.35,1) both;
}
/* Both begin at .55s. The flash cannot lag behind the first confetti. */
.planik-popper-flash, .planik-popper-particle { opacity: 0; }
.planik-popper-flash {
  transform-box: view-box;
  transform-origin: 105px 157px;
}
.planik-mascot[data-mode="celebrating"] .planik-popper-flash {
  animation: planik-popper-flash .4s ease-out .55s both;
}
.planik-popper-particle {
  transform-box: view-box;
  transform-origin: 105px 157px;
}
.planik-mascot[data-mode="celebrating"] .planik-popper-particle {
  animation: planik-confetti-burst 1.55s cubic-bezier(.14,.67,.42,1) calc(.55s + var(--planik-stagger, 0s)) both;
}
.planik-mascot[data-mode="celebrating"] .planik-svg { animation: planik-hop .48s ease-in-out 3; }

.planik-launcher-button {
  display: flex;
  width: 120px;
  height: 108px;
  align-items: center;
  justify-content: center;
  border: 0;
  padding: 0;
  color: inherit;
  background: transparent;
  box-shadow: none;
  cursor: pointer;
  transition: transform .2s ease;
}
.planik-launcher-button:hover { transform: scale(1.04); }
.planik-launcher-button:active { transform: scale(.97); }
.planik-launcher-button:focus-visible { outline: 2px solid #8b5cf6; outline-offset: 4px; border-radius: 18px; }
/* Separate overlay inside .ai-chat-expanded-main, not a child of the composer.
   The composer remains anchored by the existing absolute-position rule in
   styles.css; Planik never contributes to its height or pushes it down. */
.planik-composer-float {
  position: absolute;
  z-index: 21;
  right: 0.25rem;
  bottom: calc(0.75rem + var(--ai-composer-height, 76px) + 4px);
  height: 108px;
  width: 122px;
  pointer-events: auto;
}
body[data-theme="light"] .planik-svg { filter: drop-shadow(0 7px 9px rgba(86, 70, 141, .24)); }

@media (min-width: 1024px) {
  /* The right-hand workspace side rail begins about 400px from the edge.
     Give the larger Planik its own margin inside the workspace. */
  /* Only the normal desktop workspace: not a focused task, Work,
     fullscreen bubbles or modal sidekick. The right rail starts near 400px. */
  .ai-chat-launcher:not(.work-ai-launcher):not(.ai-chat-launcher-task-open):not(.bubble-ai-fullscreen) {
    right: 410px;
  }
  .ai-chat-launcher:not(.work-ai-launcher):not(.ai-chat-launcher-task-open):not(.bubble-ai-fullscreen) .planik-launcher-button,
  .ai-chat-launcher:not(.work-ai-launcher):not(.ai-chat-launcher-task-open):not(.bubble-ai-fullscreen) .planik-mascot--launcher {
    width: 108px;
    height: 96px;
  }
  .ai-chat-launcher:not(.work-ai-launcher):not(.ai-chat-launcher-task-open):not(.bubble-ai-fullscreen) .planik-quick-ai-preview {
    bottom: 96px;
  }
}
@media (max-width: 600px) {
  .planik-mascot--composer { width: 99px; height: 88px; }
  .planik-composer-float { width: 99px; height: 88px; right: 0; }
}
/* The hand touches the badge at 38%, grabs it, then throws left at 60%.
   Badge copies are phase-gated so no frame displays two red counters. */
@keyframes planik-notif-peel {
  0%, 37% { opacity: 1; }
  38%, 100% { opacity: 0; }
}
@keyframes planik-notif-held {
  0%, 37% { opacity: 0; }
  38%, 59% { opacity: 1; }
  60%, 100% { opacity: 0; }
}
@keyframes planik-notif-reach {
  0%, 8% { opacity: 0; transform: rotate(-57deg); }
  18%, 40% { opacity: 1; transform: rotate(0); }
  58%, 66% { opacity: 1; transform: rotate(-50deg); }
  86%, 100% { opacity: 0; transform: rotate(-10deg); }
}
@keyframes planik-notif-toss {
  0%, 59% { opacity: 0; transform: translate(-60px, 50px) rotate(-15deg) scale(1); }
  60% { opacity: 1; transform: translate(-60px, 50px) rotate(-15deg) scale(1); }
  86% { opacity: 1; }
  100% { opacity: 0; transform: translate(-250px, -64px) rotate(-530deg) scale(.58); }
}
@keyframes planik-notif-whoosh {
  0%, 55% { opacity: 0; }
  61% { opacity: .8; }
  81%, 100% { opacity: 0; }
}
@keyframes planik-float { 0%, 100% { transform: translateY(5px); } 50% { transform: translateY(-5px); } }
@keyframes planik-blink { 0%, 42%, 46%, 100% { transform: scaleY(1); } 44% { transform: scaleY(.06); } }
@keyframes planik-shy-eye { 0%, 100% { transform: scaleY(.75) rotate(-6deg); } 50% { transform: scaleY(.45) rotate(6deg); } }
@keyframes planik-glow { from { opacity: .4; } to { opacity: 1; } }
@keyframes planik-scratch { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
@keyframes planik-reach-left { from { transform: rotate(-6deg); } to { transform: rotate(9deg); } }
@keyframes planik-reach-right { from { transform: rotate(6deg); } to { transform: rotate(-9deg); } }
@keyframes planik-tap-left { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
@keyframes planik-tap-right { from { transform: rotate(4deg); } to { transform: rotate(-5deg); } }
@keyframes planik-key { 0%, 49%, 100% { fill: #59649d; } 50%, 80% { fill: #bbadff; } }
@keyframes planik-scan { from { transform: rotate(-7deg); } to { transform: rotate(6deg); } }
@keyframes planik-page-one { 0%, 29% { opacity: 1; transform: translateX(0); } 34%, 100% { opacity: 0; transform: translateX(-12px); } }
@keyframes planik-page-two { 0%, 31% { opacity: 0; transform: translateX(12px); } 36%, 64% { opacity: 1; transform: translateX(0); } 69%, 100% { opacity: 0; transform: translateX(-12px); } }
@keyframes planik-page-three { 0%, 66% { opacity: 0; transform: translateX(12px); } 71%, 97% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-12px); } }
@keyframes planik-popper-lift {
  from { transform: translate(24px,32px) rotate(10deg) scale(.65); opacity: 0; }
  to { transform: translate(0,0) rotate(0) scale(1); opacity: 1; }
}
@keyframes planik-popper-flash {
  0% { opacity: 0; transform: scale(.4); }
  12% { opacity: 1; transform: scale(1.1); }
  80%, 100% { opacity: 0; transform: scale(1.8); }
}
@keyframes planik-confetti-burst {
  0% { opacity: 0; transform: translate(0,0) scale(.45) rotate(0); }
  8% { opacity: 1; }
  65% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--planik-dx),var(--planik-dy)) scale(.85) rotate(var(--planik-rotate)); }
}
@keyframes planik-hop { 50% { transform: translateY(-12px); } }
@media (prefers-reduced-motion: reduce) {
  .planik-svg, .planik-eye, .planik-scratch-arm, .planik-type-left, .planik-type-right,
  .planik-loupe, .planik-page-one, .planik-page-two, .planik-page-three,
  .planik-notif-static, .planik-notif-take-arm, .planik-notif-flying, .planik-notif-whoosh, .planik-notif-held,
  .planik-celebrate-rig, .planik-popper-flash, .planik-popper-particle, .planik-hover-left, .planik-hover-right,
  .planik-key-a, .planik-key-b { animation: none !important; }
}

/* Softer lavender, muted framing and a gentle ambient shadow in light mode. */
body[data-theme='light'] .planik-body-stop-start { stop-color: #b8b3ec; }
body[data-theme='light'] .planik-body-stop-mid { stop-color: #928fd6; }
body[data-theme='light'] .planik-body-stop-end { stop-color: #686cb6; }
body[data-theme='light'] .planik-rim-stop-start { stop-color: #d5f4fa; }
body[data-theme='light'] .planik-rim-stop-mid { stop-color: #c7c0fa; }
body[data-theme='light'] .planik-rim-stop-end { stop-color: #a8a0e7; }
body[data-theme='light'] .planik-screen-stop-start { stop-color: #4a4a7b; }
body[data-theme='light'] .planik-screen-stop-end { stop-color: #323a66; }
body[data-theme='light'] .planik-svg { filter: drop-shadow(0 8px 11px rgba(111, 101, 159, .19)); }
body[data-theme='light'] .planik-ground-shadow {
  background: radial-gradient(ellipse, rgba(112, 105, 163, .2), transparent 78%);
}

/* Match the existing Quick AI launcher (bottom-8/right-6) in modal windows.
   Position independently of each dialog's height and never block its layout.
   Pointer events must reach Planik's SVG for the shy-eye/reaching-hands hover. */
.planik-notes-companion,
.planik-task-editor-companion {
  position: fixed;
  right: max(1.5rem, env(safe-area-inset-right));
  bottom: max(2rem, env(safe-area-inset-bottom));
  width: 135px;
  height: 120px;
  pointer-events: auto;
  z-index: 2;
}
/* On ordinary laptop-sized desktops reserve just enough room at the
   notes board's right edge without obscuring note cards or clipping Planik. */
@media (min-width: 1200px) and (max-width: 1439px) {
  .standalone-notes-backdrop:not(.standalone-notes-mobile) .standalone-notes-board {
    max-width: min(72rem, calc(100vw - 232px));
  }
  .planik-notes-companion {
    width: 108px;
    height: 96px;
  }
  .planik-notes-companion .planik-mascot--sidekick { width: 108px; height: 96px; }
}
@media (max-width: 1199px) {
  .planik-notes-companion { display: none; }
}
@media (max-width: 1139px) {
  .planik-task-editor-companion { display: none; }
}

/* The modal companions use the same live Quick AI hover panel as the
   workspace launcher. While a personal modal is open, elevate the one
   existing launcher above its backdrop. Keep its duplicate avatar invisible:
   the visible clickable/hoverable avatar is the modal companion. */
body:has(.planik-notes-companion, .planik-task-editor-companion)
  .ai-chat-launcher:not(.work-ai-launcher) {
  z-index: 280 !important;
  right: max(1.5rem, env(safe-area-inset-right)) !important;
  bottom: max(2rem, env(safe-area-inset-bottom)) !important;
  pointer-events: none;
}
body:has(.planik-notes-companion, .planik-task-editor-companion)
  .ai-chat-launcher:not(.work-ai-launcher) .planik-launcher-button {
  visibility: hidden;
  pointer-events: none;
}
/* Hover over the modal mascot opens the original shared quick-chat popover.
   The popup overlaps its top edge slightly, so moving into the popup
   preserves the regular .group:hover boundary and does not dismiss it. */
body:has(.planik-notes-companion:hover, .planik-task-editor-companion:hover)
  .ai-chat-launcher:not(.work-ai-launcher) .planik-quick-ai-preview,
body:has(.planik-notes-companion, .planik-task-editor-companion)
  .ai-chat-launcher:not(.work-ai-launcher):focus-within .planik-quick-ai-preview {
  pointer-events: auto;
  opacity: 1;
  transform: translateY(0);
}
/* Do not let the normal absolute popup offset create a gap from the sidekick. */
body:has(.planik-notes-companion, .planik-task-editor-companion)
  .ai-chat-launcher:not(.work-ai-launcher) .planik-quick-ai-preview {
  bottom: 108px;
}

/* The compact notes-side mascot is 96px tall, so tuck the popup slightly
   lower to keep a continuous hover path from robot to chat. */
@media (min-width: 1200px) and (max-width: 1439px) {
  body:has(.planik-notes-companion)
    .ai-chat-launcher:not(.work-ai-launcher) .planik-quick-ai-preview {
    bottom: 90px;
  }
}
