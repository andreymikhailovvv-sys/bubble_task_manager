services:
  - type: web
    name: bubble-task-manager
    env: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: 10000
