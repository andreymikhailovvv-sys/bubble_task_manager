name: Android Kotlin compile

on:
  push:
    branches:
      - main
      - fix/android-kotlin-build-20261024
    paths:
      - 'android-app/**'
      - '.github/workflows/android-kotlin.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-kotlin.yml'
  workflow_dispatch:

jobs:
  kotlin-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle.kts
            android-app/gradle/libs.versions.toml
            android-app/gradle/wrapper/gradle-wrapper.properties
      - name: Install compile SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile native Android Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain --stacktrace 2>&1 | tee android-compile.log
          exit ${PIPESTATUS[0]}
      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compile-log
          path: android-app/android-compile.log
          retention-days: 3
