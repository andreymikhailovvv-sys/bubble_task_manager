name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

# Never waste runners building superseded commits from the same PR branch.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --no-audit --no-fund
      - name: Compile web client and API server
        run: npm run build
      - name: Verify MTProto HTTP CONNECT proxy transport
        run: node --import tsx --test server/test/telegram-user-client-network.test.ts
      - name: Verify manual Telegram send restrictions and limits
        run: node --import tsx --test server/test/telegram-user-client-manual-send.test.ts
      - name: Verify Telegram AI draft isolation and approval-only flow
        run: node --import tsx --test server/test/telegram-user-client-ai-draft.test.ts
      - name: Verify owner-only Telegram chat read security and safe serialization
        run: node --import tsx --test server/test/telegram-user-client-read.test.ts
      - name: Verify Telegram AI selected-dialog consent and snapshot isolation
        run: node --import tsx --test server/test/telegram-user-client-dialog-assistant.test.ts
      - name: Verify personal Telegram access inside normal AI chat
        run: node --import tsx --test server/test/telegram-user-client-chat-integration.test.ts
      - name: Verify Telegram message quick-share, sealed queue and AI rewrite restrictions
        run: node --import tsx --test server/test/telegram-quick-share.test.ts
      - name: Verify AI-created Telegram inline send proposals and contact ambiguity
        run: node --import tsx --test server/test/telegram-ai-inline-send.test.ts
      - name: Verify shared Telegram icon styling and legacy panel cleanup
        run: node --import tsx --test server/test/telegram-message-action-theme.test.ts
      - name: Verify Telegram integration guide, quick-share icon and release announcement
        run: node --import tsx --test server/test/telegram-integration-release-ui.test.ts
      - name: Verify integrations popover and modal remain above workspace
        run: node --import tsx --test server/test/telegram-integrations-overlay-ui.test.ts
      - name: Verify owner-only Telegram integration setup and encrypted application keys
        run: node --import tsx --test server/test/telegram-integrations-self-service.test.ts
      - name: Verify Telegram group send targets, broadcast exclusion and private history isolation
        run: node --import tsx --test server/test/telegram-send-group-targets.test.ts
      - name: Verify explicit AI Telegram reading consent, groups and one-time continuation
        run: node --import tsx --test server/test/telegram-ai-read-consent.test.ts
      - name: Verify Telegram AI assistant opt-in policies and credit settings
        run: node --import tsx --test server/test/telegram-ai-chat-policy.test.ts
      - name: Verify Telegram identity binding
        run: node --import tsx --test server/test/telegram-user-client-binding.test.ts
      - name: Verify Telegram user-client cryptography and access gating
        run: node --import tsx --test server/test/telegram-user-client-security.test.ts
      - name: Verify image generation and document regressions
        run: node --import tsx --test server/test/ai-image-generation.test.ts server/test/ai-image-edit-followup.test.ts server/test/ai-user-uploaded-image.test.ts server/test/ai-image-edit-error-visibility.test.ts server/test/ai-office-vs-image-routing.test.ts server/test/ai-file-catalog.test.ts server/test/ai-explicit-file-tools.test.ts server/test/ai-user-office-edits.test.ts server/test/ai-office-truncated-plan.test.ts server/test/xlsx-delete-rows.test.ts server/test/ai-image-visual-preview.test.ts server/test/ai-word-documents.test.ts server/test/docker-build-dependencies.test.ts server/test/standalone-notes.test.ts server/test/standalone-note-groups.test.ts server/test/miniapp-standalone-note-creation.test.ts server/test/miniapp-focus-subtask-checkbox.test.ts server/test/completed-subtask-open-scroll.test.ts server/test/ai-personal-notes-search.test.ts server/test/ai-personal-search-intent.test.ts server/test/ai-create-notes-and-board-search.test.ts server/test/universal-workspace-search.test.ts server/test/updates-news-theme.test.ts server/test/device-guest-security.test.ts server/test/security-rate-limiter.test.ts server/test/google-oauth-security.test.ts server/test/task-reference-authorization.test.ts server/test/collaboration-invite-revocation.test.ts server/test/collaboration-access-revocation.test.ts server/test/ai-legacy-access-revocation.test.ts server/test/task-ai-editor-sync.test.ts server/test/yookassa.service.test.ts server/test/yookassa-payment-recovery.test.ts server/test/yookassa-paid-credit-reconciliation.test.ts server/test/ai-credit-wallet.service.test.ts server/test/account-registration.service.test.ts server/test/one-time-ai-trial.test.ts server/test/ai-credit-wallet.service.test.ts server/test/guest-credit-security.test.ts server/test/ai-chat-request-idempotency.test.ts server/test/openai-responses-stream.test.ts server/test/dynamic-responses-billing.test.ts server/test/task-ai-request-idempotency.test.ts server/test/telegram-webhook-security.test.ts server/test/telegram-update-queue.test.ts server/test/telegram-relay.controller.test.ts server/test/miniapp-habit-tracker-ui.test.ts client/src/lib/habitTracker.test.ts
      - name: Build the deployment Docker image
        run: docker build --progress=plain -t bubble-task-manager:ci .
