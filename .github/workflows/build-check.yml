name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

# Never waste runners building superseded commits from the same PR branch.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --no-audit --no-fund
      - name: Compile web client and API server
        run: npm run build
      - name: Verify public SEO pages and first-visit welcome
        run: node --import tsx --test server/test/public-seo-pages.test.ts server/test/welcome-first-visit.test.ts
      - name: Verify task chat answer preservation and immediate-action prompt
        run: node --import tsx --test --test-name-pattern="task assistant не подменяет творческий ответ|task assistant сохраняет инструкцию выполнять изменения" server/test/ai-assistant.service.test.ts
      - name: Verify MTProto HTTP CONNECT and Telegram SOCKS5 proxy transport
        run: node --import tsx --test server/test/telegram-user-client-network.test.ts server/test/telegram-socks5.test.ts
      - name: Verify manual Telegram send restrictions and limits
        run: node --import tsx --test server/test/telegram-user-client-manual-send.test.ts
      - name: Verify Telegram AI draft isolation and approval-only flow
        run: node --import tsx --test server/test/telegram-user-client-ai-draft.test.ts
      - name: Verify owner-only Telegram chat read security and safe serialization
        run: node --import tsx --test server/test/telegram-user-client-read.test.ts
      - name: Verify Telegram AI selected-dialog consent and snapshot isolation
        run: node --import tsx --test server/test/telegram-user-client-dialog-assistant.test.ts
      - name: Verify personal Telegram access inside normal AI chat
        run: node --import tsx --test server/test/telegram-user-client-chat-integration.test.ts
      - name: Verify Telegram message quick-share, sealed queue and AI rewrite restrictions
        run: node --import tsx --test server/test/telegram-quick-share.test.ts
      - name: Verify AI-created Telegram inline send proposals and contact ambiguity
        run: node --import tsx --test server/test/telegram-ai-inline-send.test.ts
      - name: Verify shared Telegram icon styling and legacy panel cleanup
        run: node --import tsx --test server/test/telegram-message-action-theme.test.ts
      - name: Verify chat forwarding to standalone notes and AI text rewrite
        run: node --import tsx --test server/test/chat-message-note-forward.test.ts
      - name: Verify Telegram integration guide, quick-share icon and release announcement
        run: node --import tsx --test server/test/telegram-integration-release-ui.test.ts
      - name: Verify integrations popover and modal remain above workspace
        run: node --import tsx --test server/test/telegram-integrations-overlay-ui.test.ts
      - name: Verify owner-only Telegram integration setup and encrypted application keys
        run: node --import tsx --test server/test/telegram-integrations-self-service.test.ts
      - name: Verify Telegram group send targets, broadcast exclusion and private history isolation
        run: node --import tsx --test server/test/telegram-send-group-targets.test.ts
      - name: Verify explicit AI Telegram reading consent, groups and one-time continuation
        run: node --import tsx --test server/test/telegram-ai-read-consent.test.ts
      - name: Verify Telegram AI assistant opt-in policies and credit settings
        run: node --import tsx --test server/test/telegram-ai-chat-policy.test.ts
      - name: Verify Telegram task receipts and cross-surface AI chat synchronization
        run: node --import tsx --test server/test/ai-chat-cross-surface-sync.test.ts client/src/lib/ai-chat-storage.test.ts
      - name: Verify blue reminder timeline and notification behavior
        run: node --import tsx --test server/test/timeline-reminders.test.ts server/test/ai-chat-navigation-reminders-ui.test.ts
      - name: Verify Telegram task change action buttons and quick-chat deep link
        run: node --import tsx --test server/test/telegram-ai-action-buttons.test.ts
      - name: Verify AI weekday task due dates and failed proposal receipts
        run: node --import tsx --test server/test/planner-due-date.test.ts
      - name: Verify Telegram bot auto-apply and task proposal undo
        run: node --import tsx --test server/test/ai-task-proposal-undo.test.ts
      - name: Verify Telegram assistant project deduplication and media setting
        run: node --import tsx --test server/test/telegram-ai-chat-proliferation.test.ts
      - name: Verify Telegram unified AI inbox and per-chat models
        run: node --import tsx --test server/test/telegram-ai-inbox.test.ts
      - name: Verify Telegram monitor attachment handling
        run: node --import tsx --test server/test/telegram-ai-monitor-media.test.ts
      - name: Verify Telegram autonomous monitoring and credits
        run: node --import tsx --test server/test/telegram-ai-monitoring.test.ts
      - name: Verify Telegram identity binding
        run: node --import tsx --test server/test/telegram-user-client-binding.test.ts
      - name: Verify Telegram user-client cryptography and access gating
        run: node --import tsx --test server/test/telegram-user-client-security.test.ts
      - name: Verify image edit animation and attachment previews
        run: node --import tsx --test server/test/ai-image-edit-attachment-ui.test.ts
      - name: Verify mobile web and Telegram Mini App shared filters, notes and current HTML
        run: node --import tsx --test server/test/mobile-workspace-parity.test.ts
      - name: Verify opt-in task monitoring isolation and status UI
        run: node --import tsx --test server/test/task-monitoring-beta.test.ts
      - name: Verify monitoring chat controls, follow-ups and deduplicated delivery
        run: node --import tsx --test server/test/task-monitoring-chat-ui.test.ts
      - name: Verify opt-in monitoring scheduler and follow-up triggers
        run: node --import tsx --test server/test/task-monitoring-scheduler.test.ts server/test/task-monitoring-fallback.test.ts
      - name: Verify autonomous monitoring action limits and badges
        run: node --import tsx --test server/test/task-monitoring-actions.test.ts
      - name: Verify monitoring reply delivery across clients and Telegram
        run: node --import tsx --test server/test/task-monitoring-delivery.test.ts
      - name: Verify note group pills, unassigned sector, bulk postpone exclusions and web boot splash
        run: node --import tsx --test server/test/web-notes-postpone-bubbles-boot.test.ts
      - name: Verify newest Focus subtasks, AI note editing, chat scrolling and themed calendar
        run: node --import tsx --test server/test/focus-note-edit-chat-scroll.test.ts
      - name: Verify hidden-tab browser notifications and synced defaults
        run: node --import tsx --test server/test/browser-system-notifications.test.ts
      - name: Verify image generation and document regressions
        run: node --import tsx --test server/test/ai-image-multireference.test.ts server/test/ai-image-generation.test.ts server/test/ai-image-edit-followup.test.ts server/test/ai-user-uploaded-image.test.ts server/test/ai-image-edit-error-visibility.test.ts server/test/ai-office-vs-image-routing.test.ts server/test/ai-file-catalog.test.ts server/test/ai-explicit-file-tools.test.ts server/test/attachment-storage-management.test.ts server/test/recurrence-creation.test.ts server/test/ai-user-office-edits.test.ts server/test/ai-office-truncated-plan.test.ts server/test/xlsx-delete-rows.test.ts server/test/ai-image-visual-preview.test.ts server/test/task-completion-report.test.ts server/test/ai-word-documents.test.ts server/test/settings-modal-parity.test.ts server/test/ai-chat-reply-title-focus-theme.test.ts server/test/docker-build-dependencies.test.ts server/test/standalone-notes.test.ts server/test/standalone-note-groups.test.ts server/test/web-notes-and-description-resize.test.ts server/test/web-task-subtask-metadata-icons.test.ts server/test/miniapp-standalone-note-creation.test.ts server/test/miniapp-focus-subtask-checkbox.test.ts server/test/completed-subtask-open-scroll.test.ts server/test/task-chat-web-search.test.ts server/test/ai-personal-notes-search.test.ts server/test/ai-personal-search-intent.test.ts server/test/ai-create-notes-and-board-search.test.ts server/test/universal-workspace-search.test.ts server/test/updates-news-theme.test.ts server/test/device-guest-security.test.ts server/test/security-rate-limiter.test.ts server/test/google-oauth-security.test.ts server/test/task-reference-authorization.test.ts server/test/collaboration-invite-revocation.test.ts server/test/collaboration-access-revocation.test.ts server/test/ai-legacy-access-revocation.test.ts server/test/task-ai-editor-sync.test.ts server/test/yookassa.service.test.ts server/test/yookassa-payment-recovery.test.ts server/test/yookassa-paid-credit-reconciliation.test.ts server/test/ai-credit-wallet.service.test.ts server/test/account-registration.service.test.ts server/test/one-time-ai-trial.test.ts server/test/ai-credit-wallet.service.test.ts server/test/guest-credit-security.test.ts server/test/ai-chat-request-idempotency.test.ts server/test/openai-responses-stream.test.ts server/test/dynamic-responses-billing.test.ts server/test/task-ai-request-idempotency.test.ts server/test/telegram-webhook-security.test.ts server/test/telegram-update-queue.test.ts server/test/telegram-relay.controller.test.ts server/test/miniapp-habit-tracker-ui.test.ts client/src/lib/habitTracker.test.ts
      - name: Verify AI checkup analysis, selective approvals and Telegram view-only navigation
        run: node --import tsx --test server/test/daily-ai-checkup.test.ts server/test/daily-ai-checkup-proposal.test.ts server/test/daily-ai-checkup-telegram.test.ts
      - name: Verify repeatable manual AI checkup and app navigation
        run: node --import tsx --test server/test/ai-checkup-manual.test.ts server/test/miniapp-habit-tracker-ui.test.ts
      - name: Build the deployment Docker image
        run: docker build --progress=plain -t bubble-task-manager:ci .
