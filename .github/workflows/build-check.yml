name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

# Never waste runners building superseded commits from the same PR branch.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --no-audit --no-fund
      - name: Compile web client and API server
        run: npm run build
      - name: Verify image generation and document regressions
        run: node --import tsx --test server/test/ai-image-generation.test.ts server/test/ai-image-edit-followup.test.ts server/test/ai-user-uploaded-image.test.ts server/test/ai-user-office-edits.test.ts server/test/xlsx-delete-rows.test.ts server/test/ai-image-visual-preview.test.ts server/test/ai-word-documents.test.ts server/test/docker-build-dependencies.test.ts server/test/standalone-notes.test.ts server/test/standalone-note-groups.test.ts server/test/miniapp-standalone-note-creation.test.ts server/test/ai-personal-notes-search.test.ts server/test/ai-personal-search-intent.test.ts server/test/ai-create-notes-and-board-search.test.ts server/test/universal-workspace-search.test.ts server/test/updates-news-theme.test.ts server/test/device-guest-security.test.ts server/test/security-rate-limiter.test.ts
      - name: Build the deployment Docker image
        run: docker build --progress=plain -t bubble-task-manager:ci .
