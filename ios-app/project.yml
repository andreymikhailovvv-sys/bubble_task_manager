name: Planirovych

options:
  bundleIdPrefix: ru.planirovych
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Planirovych:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Planirovych
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.planirovych.iosdemo
        PRODUCT_NAME: Planirovych
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Планировыч"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Микрофон нужен для голосовых запросов в общем чате Планировыча."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"

schemes:
  Planirovych:
    build:
      targets:
        Planirovych: all
    run:
      config: Debug
